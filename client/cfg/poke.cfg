#   (??              ?????F2
#   insertcard        ????????????????????
#   insertcard_auto   ?????????????? <- ???????????
# insertcard_auto

# --- baton 7: analog / movement (2026-10-22) --------------------------------
# 0x8000 (uint16 centre) is compared as int16 (-32768) by the digital-direction
# threshold loop in sub_D7ABE0, so ch3/ch5 looked permanently pressed and the
# character always walked one way.  These two immediates make the threshold
# loop never fire; the atan2 analog path is untouched.
poken 0xD7AE1D 7F FF
poken 0xD7AE5E 00 80
# keyboard -> analog channels 0/1 at the vtable slot14 read point
# (built into probe_b7/probe.dll; sx=sy=-1, gain=28000 by default)
analog_keys 1


# --- baton 7: action buttons (ch7..ch12 = bits 0..5) -----------------------
# Player-0 channel table in sub_B7CB30: [7,8,9,10,11,12,3,4,5,6].
# The controller reads ch7..ch12 through vtable **slot 1** (sub_D7A6F0 ??node+4),
# not slot 3 -- that is why the first round of `map` did nothing.
# User-verified 2026-10-22 (second pass, final):
#   Z ch10 = A        X ch11 = B
#   F ch7  = ?????     C ch12 = ?????????
#   G ch8 / H ch9 = ??????????????# The binds themselves are in the `map` block near the top of this file.


# --- baton7 experiment: candidate player status (level @0x2775E68) ---
# PORTABLE: dev-only level/EXP pokes are disabled in the client package.
# poke 0x2775E68 0x0000000A


# --- baton7: EXP -> level 10 (PlayWork+0x10, table L10=26000) ---
# poke 0x30A7878 0x00007530


# --- baton8: START button candidate (ch52) -> F6 (VK 0x75) ---
map 52 0x75
