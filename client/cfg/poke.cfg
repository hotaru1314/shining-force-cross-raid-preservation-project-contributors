# ---------------------------------------------------------------------------
# probe.dll configuration -- read every 400 ms, applied to the running game.
#
# Everything needed to boot Shining Force Cross Raid without a real cabinet:
#   * fake JVS node (passes the I/O self-check)
#   * file-backed IC card instead of the serial Maxell reader
#   * neutral analog values (otherwise the character walks left forever)
#   * the updater check skipped (it would otherwise poll for ever)
# ---------------------------------------------------------------------------

# --- fake JVS node: capability bytes the self-check looks at ----------------
rep 0x322297F 07 01

# --- IC card --------------------------------------------------------------
# The game builds two device objects in sub_86C5B0:
#   manager[0] = DeviceMaxell (serial, needs real hardware)
#   manager[1] = DeviceUSB    (file backed: <drive>:\iccard.txt + iccard.bin)
# Swap the two factories so manager[0] becomes the file-backed one.
poken 0x86C5CD E8 58 DB BC FF
poken 0x86C5DC E8 EC 4E BF FF
# Keep a card in the slot: whenever the device drops back to RELEASED (the
# game ejects after reading) the probe calls DeviceUSB::insert again.
# Hotkeys in probe.dll: F2 = insert card, F1 = coin, F10 = eject (debug).

# --- input ----------------------------------------------------------------
# Spy on the switch/analog channels the game polls (log only).
spykeys
# baton 7: log VALUES (switch-bit changes + analogs), so we can see whether a
# bit is stuck at 1 with no key pressed, and what the analog getter returns.
swlog
anlog
#
# --- movement + action button bindings (2026-10-22 baton 7) -----------------
# Movement is NOT these switch bits: it is analog ch0/1 (poken threshold patch
# below + `analog_keys`).  The binds cover the JVS buttons, which the player
# controller reads through vtable slot1 (node+4):
#   ch10=Z=A  ch11=X=B  ch7=F=????? ch12=C=?????????
#   ch8=G / ch9=H still unknown
map 3  0x25     # Left   (digital direction fallback, normally unused)
map 4  0x27     # Right
map 5  0x26     # Up
map 6  0x28     # Down
map 7  0x46     # F  = ?????map 8  0x47     # G
map 9  0x48     # H
map 10 0x5A     # Z  = A
map 11 0x58     # X  = B
map 12 0x43     # C  = ?????????
#
# 2026-10-21 22:5x: 0x8000 is CENTRE (uint16), so `analog_center 128` was the
# wrong idea and is disabled.  The real fix is in ANALYSIS ??1 (signed threshold
# bug in sub_D7ABE0) + the `poken 0xD7AE1D/0xD7AE5E` lines at the bottom.
# centeran 128
# analog_center 128

# --- updater --------------------------------------------------------------
# sub_E68770 is the updater tick: it asks the local "catcher" router (PCP 40110)
# to start mfetcher.exe and then polls request=isupdate every ~130 ms.  Without
# a real catcher it never finishes, and the ticket check later reports
# "??????????????????????.  Turning the tick into a bare ret skips it.
poken 0xE68770 C3

# ??mNetwork ????????????????????

# force the four amNetwork server addresses (route/auth/billing/bbrouter)
forcenet 10.0.0.10

# --- router discovery state ---
watch 0x3233AB0
watch 0x3233A28
watch 0x324EC4C
watch 0x324EC58
watch 0x324EC74
watch 0x324EC70

veh

# --- ALL.Net task state ---
watch 0x18C38F0
watch 0x18C38F4
watch 0x18C3900
watch 0x18C3904
# --- amNetwork per-interface status: the ALL.Net task (state 3) checks these ---
#   vtable+0x10 -> sub_5A7810 (__stdcall, so "ret 4")
#   vtable+0x14 -> sub_5A77F0 (__stdcall, so "ret 4")
poken 0x5A7810 B8 01 00 00 00 C2 04 00
poken 0x5A77F0 B8 01 00 00 00 C2 04 00
# --- network-ready counter used by the ALL.Net task ---
watch 0x18C447C

# --- MAIN ID default (2026-10-20) ------------------------------------------
# sub_E42270 fills the amSysData serial field with the literal at 0x164A918
# ("INVALID_SERIALNO", 16 bytes + NUL).  The real record read (sub_E42150)
# still returns -23 because the mxstorage binary channel (40115) is missing,
# so the game always shows the default.  Replace the literal with the value
# TeknoParrot used to show ("AALG-TG-070924E2"), same 16 bytes.
# This is display-only: amSysData still has no real record.
poken 0x164A918 41 41 4C 47 2D 54 47 2D 30 37 30 39 32 34 45 32

# --- 40115 RE notes (2026-10-21 00:00) -------------------------------------
# off_18823F8 -> amStorage state struct (runtime 0x3233EA0):
#   +0x0C  phase: 1=send text req, 2/3=wait, 4=parse text reply,
#                5=amStorageOpenBinary, 6=pcpaRecvBinary, 7=done
#   +0x14  request type (3 = query_storage_info path)
#   +0x1C  binary recv size  (observed 0x100000 = storage_size)
#   +0x520 recv buffer pointer
# Measured: with a listener that sends 1 MiB at accept, phase 5 -> 6 happens,
# recv finishes in ~20 ms, then phase returns to 1 and the game exits ~2.7 s
# later.  So the transfer works; the 1 MiB *content* is what gets rejected.
# (watch lines were removed to keep probe.log readable)


# --- ALL.Net experiment: 5th session (2026-10-21 12:5x) --------------------
# Unblock the ALL.Net ready counter (INDEX 0.9): the game keeps writing 1,
# probe pushes it back to 0 so sub_55DDA0 advances 18C447C 2 -> 3.
rep 0x30A2548 00
# HTTP engine: status (0x333D4AC), last error (0x333D484), decode dest ptr.
watch 0x333D4AC
watch 0x333D484
watch 0x333D4B4
watch 0x18C3D70


# --- match/echo server address (2026-10-21) -------------------------------
# The game resolves an EMPTY hostname (config field missing); on Windows
# getaddrinfo("") returns all local addresses and the game takes the first
# (the Radmin VPN IP 26.42.23.36) then probes UDP :52002 there forever.
# Force the resolved address to 10.0.0.10 so the probe hits our listener.
#
# 2026-10-21 14:0x (baton 6): connlog.dll now pins the empty node itself
# (getaddrinfo hook -> ib.naominet.jp -> 10.0.0.10; log line
#  "empty node -> ib.naominet.jp (pinned)").  This rep is therefore REDUNDANT,
# kept as belt-and-braces.  The ?????icon gate turned out to be the spSif ping
# REPLY FORMAT (12 bytes), not this address
# PORTABLE: the old belt-and-braces `rep 0x3233AB0 C0 A8 02 0A` pinned the
# match address to 10.0.0.10.  connlog's empty-node pin + dnsmap.txt already
# route it, so the rep is removed here to keep the server IP in exactly two
# places (forcenet + dnsmap).
# rep 0x3233AB0 C0 A8 02 0A

